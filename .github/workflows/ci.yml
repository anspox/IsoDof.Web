name: .NET CI

on:
  push:
    branches: [ "main", "master" ]
  pull_request:
    branches: [ "main", "master" ]

jobs:
  build-and-test:
    runs-on: ubuntu-latest

    steps:
    - uses: actions/checkout@v4
    
    - name: Setup .NET
      uses: actions/setup-dotnet@v4
      with:
        dotnet-version: 8.0.x
        
    - name: Restore dependencies
      run: dotnet restore IsoDof.sln
      
    - name: Build
      run: dotnet build IsoDof.sln --no-restore
      
    - name: Test
      run: dotnet test IsoDof.sln --no-build --verbosity normal
